# Download manifest. Every file records where it came from and its expected size in bytes.
# Parts with `default: true` are fetched by `treewm download <dataset>` when no --parts is given.
belgian:
  title: "QSMs, point cloud and harvest data from a destructive forest biomass experiment in Belgium (Demol et al. 2021)"
  license: CC-BY-4.0
  record: https://zenodo.org/records/4557401
  files:
    csv:    {url: "https://zenodo.org/records/4557401/files/Destructive_and_qsm_data_DEMOL.csv?download=1", name: Destructive_and_qsm_data_DEMOL.csv, size: 17021, default: true}
    qsm:    {url: "https://zenodo.org/records/4557401/files/optimal_QSMs.zip?download=1", name: optimal_QSMs.zip, size: 15794485, default: true, extract: zip}
    clouds: {url: "https://zenodo.org/records/4557401/files/pointclouds_clean.7z?download=1", name: pointclouds_clean.7z, size: 127561955, default: true, extract: 7z}
    images: {url: "https://zenodo.org/records/4557401/files/images.7z?download=1", name: images.7z, size: 174212413, default: false, extract: 7z}

biodiv:
  title: "BioDiv-3DTrees: labelled single tree point clouds, QSMs and tree graphs (Griese et al. 2025)"
  license: CC-BY-4.0
  record: https://doi.org/10.25625/8PB1IF
  files:
    readme: {url: "https://data.goettingen-research-online.de/api/access/datafile/142312", name: README.md, size: 10838, default: true}
    labels: {url: "https://data.goettingen-research-online.de/api/access/datafile/142314", name: labels.csv, size: 1109780, default: true}
    graphs: {url: "https://data.goettingen-research-online.de/api/access/datafile/142310", name: Graphs.tar.zst, size: 1776293128, default: true, extract: tar.zst}
    uls:    {url: "https://data.goettingen-research-online.de/api/access/datafile/142311", name: ULS.tar.zst, size: 652222562, default: true, extract: tar.zst}
    tls:    {url: "https://data.goettingen-research-online.de/api/access/datafile/142309", name: TLS.tar.zst, size: 19941204645, default: false, extract: tar.zst}
    qsm:    {url: "https://data.goettingen-research-online.de/api/access/datafile/142308", name: QSM.tar.zst, size: 108024254404, default: false, extract: tar.zst, note: "108 GB, exceeds free disk; not used in v1"}

