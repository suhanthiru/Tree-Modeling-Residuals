# Published basic wood density of stemwood: dry mass per fresh (green) volume, kg/m3.
# Used by treewm/baselines/density.py. Not fitted to any of our trees.
source: >-
  IPCC Good Practice Guidance for LULUCF (2003), table 3A.1.9-1, as reproduced in FAO Global
  Forest Resources Assessment 2005, guidelines for country reporting, appendix 5, table 5.2
  (https://www.fao.org/4/j2132e/J2132e16.htm). Row source for every value below: Dietz (1975),
  Holz Roh- Werkstoff 33: 135-141.
units: kg/m3 (table values in t/m3 x 1000)
note: >-
  Rows are species where the table lists the species, otherwise its genus row. Transcribed from
  the FAO page; check against it before adding rows.
