[project]
name = "treewm"
version = "0.1.0"
description = "Tree World Model v1: LiDAR geometry, volume and biomass estimation with classical baselines and residual ML"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "polars>=1.0",
  "pyarrow>=16",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "laspy[lazrs]>=2.5",
  "py7zr>=0.21",
  "zstandard>=0.22",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
treewm = "treewm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treewm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
